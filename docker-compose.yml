services:
  api:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    environment:
      PORT: "4000"
      USE_MODELS: "${USE_MODELS:-0}"         
      MONGODB_URI: "${MONGODB_URI:-}"         
      NEWSAPI_KEY: "${NEWSAPI_KEY:-}"
    ports:
      - "4000:4000"
    volumes:
      - models_cache:/app/src/server/node_modules/@huggingface/transformers/.cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./src/client
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  mongo:
    image: mongo:7
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  models_cache:
